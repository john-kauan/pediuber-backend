name: Backend CI/CD - PediUber

'on':
  push:
    branches:
      - main
      - semana-5-observabilidade-cicd

  pull_request:
    branches:
      - main

  workflow_dispatch:

jobs:
  build-and-tests:
    name: Build e testes unitarios e contrato
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: pediuber

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Dar permissao ao Maven Wrapper
        run: chmod +x mvnw

      - name: Rodar testes unitarios e de contrato
        run: ./mvnw test

      - name: Gerar pacote da aplicacao
        run: ./mvnw package -DskipTests

  integration-tests:
    name: Testes de integracao com Postgres e RabbitMQ
    runs-on: ubuntu-latest
    needs: build-and-tests

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: pediuber
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d pediuber"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      rabbitmq:
        image: rabbitmq:3-management
        ports:
          - 5672:5672
          - 15672:15672
        options: >-
          --health-cmd="rabbitmq-diagnostics -q ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    defaults:
      run:
        working-directory: pediuber

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Dar permissao ao Maven Wrapper
        run: chmod +x mvnw

      - name: Rodar testes com perfil CI
        env:
          SPRING_PROFILES_ACTIVE: ci
          INSTANCE_ID: github-actions
        run: ./mvnw test

  docker-build:
    name: Build da imagem Docker
    runs-on: ubuntu-latest
    needs:
      - build-and-tests
      - integration-tests

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Build da imagem Docker do backend
        run: docker build -t pediuber-backend:ci ./pediuber

  deploy:
    name: Deploy automatizado com Docker Compose
    runs-on: ubuntu-latest
    needs: docker-build

    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Criar rede externa usada pelo Core
        run: docker network create ridefleet-net || true

      - name: Subir ambiente com Docker Compose
        run: docker compose up -d --build

      - name: Aguardar inicializacao
        run: sleep 45

      - name: Ver containers
        run: docker compose ps

      - name: Testar health pelo load balancer
        run: curl -f http://localhost:8082/actuator/health

      - name: Testar endpoint Prometheus
        run: curl -f http://localhost:8082/actuator/prometheus

      - name: Derrubar ambiente apos validacao
        if: always()
        run: docker compose down