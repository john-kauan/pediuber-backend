name: Backend CI/CD - PediUber

'on':
  push:
    branches:
      - main
      - semana-5-observabilidade-cicd

  pull_request:
    branches:
      - main

jobs:
  build-and-tests:
    name: Build e testes
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: pediuber

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Dar permissão ao Maven Wrapper
        run: chmod +x mvnw

      - name: Rodar testes unitários e de contrato
        run: ./mvnw test

      - name: Gerar pacote da aplicação
        run: ./mvnw package -DskipTests

  docker-build:
    name: Build da imagem Docker
    runs-on: ubuntu-latest
    needs: build-and-tests

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Build da imagem Docker do backend
        run: docker build -t pediuber-backend:ci ./pediuber

  deploy:
    name: Deploy automatizado
    runs-on: ubuntu-latest
    needs: docker-build

    if: github.ref == 'refs/heads/main'

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Deploy automático simulado
        run: |
          echo "Deploy automático iniciado na branch main"
          echo "Imagem Docker validada: pediuber-backend"
          echo "Em ambiente real, este job executaria docker compose pull/up no servidor"
          echo "Deploy finalizado com sucesso"