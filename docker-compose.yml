services:

  postgres:
    image: postgres:16
    container_name: pediuber-postgres
    environment:
      POSTGRES_DB: pediuber
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"

  rabbitmq:
    image: rabbitmq:3-management
    container_name: pediuber-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"