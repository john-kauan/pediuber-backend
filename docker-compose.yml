services:

  postgres:
    image: postgres:16
    container_name: pediuber-postgres
    environment:
      POSTGRES_DB: pediuber
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    networks:
      - pediuber-net

  rabbitmq:
    image: rabbitmq:3-management
    container_name: pediuber-rabbitmq
    ports:
      - "5673:5672"
      - "15673:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - pediuber-net

  pediuber-backend-1:
    build:
      context: ./pediuber
      dockerfile: Dockerfile
    container_name: pediuber-backend-1
    depends_on:
      - postgres
      - rabbitmq
    environment:
      environment:
      SPRING_PROFILES_ACTIVE: docker
      INSTANCE_ID: pediuber-backend-1
      RIDEFLEET_GROUP_ID: "${RIDEFLEET_GROUP_ID:-pediuber}"
      RIDEFLEET_API_KEY: "${RIDEFLEET_API_KEY:-}"
      RIDEFLEET_CORE_BASE_URL: "${RIDEFLEET_CORE_BASE_URL:-http://ridefleet-core:8080/api/v1}"
    expose:
      - "8080"
    restart: always
    networks:
      - pediuber-net
      - ridefleet-net

  pediuber-backend-2:
    build:
      context: ./pediuber
      dockerfile: Dockerfile
    container_name: pediuber-backend-2
    depends_on:
      - postgres
      - rabbitmq
    environment:
      SPRING_PROFILES_ACTIVE: docker
      INSTANCE_ID: pediuber-backend-2
      IDEFLEET_GROUP_ID: "${RIDEFLEET_GROUP_ID:-pediuber}"
      RIDEFLEET_API_KEY: "${RIDEFLEET_API_KEY:-}"
      RIDEFLEET_CORE_BASE_URL: "${RIDEFLEET_CORE_BASE_URL:-http://ridefleet-core:8080/api/v1}"
    expose:
      - "8080"
    restart: always
    networks:
      - pediuber-net
      - ridefleet-net

  pediuber-backend-3:
    build:
      context: ./pediuber
      dockerfile: Dockerfile
    container_name: pediuber-backend-3
    depends_on:
      - postgres
      - rabbitmq
    environment:
      SPRING_PROFILES_ACTIVE: docker
      INSTANCE_ID: pediuber-backend-3
      RIDEFLEET_GROUP_ID: "${RIDEFLEET_GROUP_ID:-pediuber}"
      RIDEFLEET_API_KEY: "${RIDEFLEET_API_KEY:-}"
      RIDEFLEET_CORE_BASE_URL: "${RIDEFLEET_CORE_BASE_URL:-http://ridefleet-core:8080/api/v1}"
    expose:
      - "8080"
    restart: always
    networks:
      - pediuber-net
      - ridefleet-net

  pediuber-load-balancer:
    image: nginx:1.27-alpine
    container_name: pediuber-load-balancer
    depends_on:
      - pediuber-backend-1
      - pediuber-backend-2
      - pediuber-backend-3
    ports:
      - "8082:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    restart: always
    networks:
      - pediuber-net

volumes:
  rabbitmq_data:

networks:
  pediuber-net:
    driver: bridge

  ridefleet-net:
    external: true