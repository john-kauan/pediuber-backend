services:

  postgres:
    image: postgres:16
    container_name: pediuber-postgres
    environment:
      POSTGRES_DB: pediuber
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    networks:
      - pediuber-net

  rabbitmq:
    image: rabbitmq:3-management
    container_name: pediuber-rabbitmq
    ports:
      - "5673:5672"
      - "15673:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - pediuber-net

  pediuber:
    build:
      context: ./pediuber
      dockerfile: Dockerfile

    container_name: pediuber-backend

    ports:
      - "8082:8080"

    depends_on:
      - postgres
      - rabbitmq

    environment:
      SPRING_PROFILES_ACTIVE: docker
      RIDEFLEET_API_KEY: "${RIDEFLEET_API_KEY:-}"

    restart: always

    networks:
      - pediuber-net
      - ridefleet-net

    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:8080/health || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  rabbitmq_data:

networks:
  pediuber-net:
    driver: bridge

  ridefleet-net:
    external: true
    name: ridefleet-net