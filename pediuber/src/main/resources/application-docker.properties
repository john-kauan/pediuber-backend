spring.application.name=pediuber

server.port=8080

spring.datasource.url=jdbc:postgresql://postgres:5432/pediuber
spring.datasource.username=postgres
spring.datasource.password=postgres

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.rabbitmq.host=rabbitmq
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

ridefleet.core.base-url=http://ridefleet-core:8080/api/v1
ridefleet.group-id=pediuber
ridefleet.api-key=${RIDEFLEET_API_KEY:}

management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.prometheus.metrics.export.enabled=true

management.metrics.tags.application=${spring.application.name}
management.metrics.tags.group=${ridefleet.group-id}
management.metrics.tags.instance=${INSTANCE_ID:pediuber-backend}